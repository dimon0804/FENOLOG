<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Значок вкладки: тот же фирменный знак, но урезанный до силуэта.
       Спутник, волны и надпись выброшены намеренно: в 16 пикселях от них
       остаётся грязь, а дуга с ростком узнаются. Тёмная плашка — из макета,
       она же не даёт знаку пропасть на светлой панели вкладок.
       Линии заметно толще, чем в знаке интерфейса, по той же причине. -->
  <rect width="32" height="32" rx="7" fill="#0d120d"/>

  <!-- поле: два слоя борозд, сходящихся в точку на окружности -->
  <path d="M5.98 24.35A15.09 15.09 0 0 1 18.82 29.03A256.91 256.91 0 0 0 5.98 24.35Z" fill="#4e9b36"/>
  <path d="M4.45 21.7A14.62 14.62 0 0 1 20.9 28.35A25.54 25.54 0 0 0 4.45 21.7Z" fill="#77c043"/>

  <!-- росток -->
  <path d="M15.16 13.8L15.16 23.33" stroke="#4e9b36" stroke-width="1.5"/>
  <path d="M9.18 12.73A5.76 5.76 0 0 1 15.37 19.4A5.69 5.69 0 0 1 9.18 12.73Z" fill="#4e9b36"/>
  <path d="M16.21 20.52A3.17 3.17 0 0 1 19.93 16.17A3.24 3.24 0 0 1 16.21 20.52Z" fill="#4e9b36"/>

  <!-- незамкнутое кольцо: зелёная дуга справа, белая слева и сверху -->
  <path d="M28.48 15.49A12.55 12.55 0 0 1 20.9 28.35" stroke="#77c043" stroke-width="2.2"
        stroke-linecap="round" fill="none"/>
  <path d="M17.96 4.4A12.55 12.55 0 0 0 3.88 20.05" stroke="#f4f7f3" stroke-width="2.2"
        stroke-linecap="round" fill="none"/>
</svg>
