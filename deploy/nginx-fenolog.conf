# Обратный прокси для «Фенолога» на fenolog.clv-digital.tech
#
# Сервис слушает только на локальном адресе, наружу его отдаёт nginx. Так у
# приложения не появляется забот про TLS и сертификаты, а у сервера остаётся
# один вход на 443 порт.
#
# Ставится так:
#   sudo cp deploy/nginx-fenolog.conf /etc/nginx/sites-available/fenolog
#   sudo ln -sf /etc/nginx/sites-available/fenolog /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d fenolog.clv-digital.tech
#
# Certbot сам допишет сюда блок с сертификатом и перенаправление с 80 порта.

server {
    listen 80;
    listen [::]:80;
    server_name fenolog.clv-digital.tech;

    # Разбор одного поля идёт минутами: сервис ходит за снимками в облачное
    # хранилище, за погодой и за контурами соседей. Стандартные шестьдесят
    # секунд nginx обрывают такой запрос на середине, и пользователь видит
    # пятьсот вторую вместо результата.
    proxy_connect_timeout 30s;
    proxy_send_timeout    600s;
    proxy_read_timeout    600s;

    # Ответ с рядом за пятнадцать сезонов — это сотни килобайт JSON, и он
    # прекрасно жмётся. Картинки и PDF не трогаем: они уже сжаты.
    gzip on;
    gzip_types application/json application/javascript text/css text/plain image/svg+xml;
    gzip_min_length 1024;

    # Загрузка журнала полевых работ и разбор нарисованного контура — тела
    # небольшие, но контур с сотней вершин в стандартный мегабайт упирается.
    client_max_body_size 8m;

    location / {
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;

        # Настоящий адрес посетителя и схема: без них сервис в логах видит
        # только localhost, а ссылки в ответах получаются http вместо https.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Прогресс разбора приходит частыми короткими ответами; буферизация
        # склеивает их и полоса прогресса замирает.
        proxy_buffering off;
    }

    # Страницы ошибок самого nginx: если сервис не запущен или перезапускается,
    # посетитель должен увидеть оформленную страницу, а не белый экран с
    # надписью «502 Bad Gateway».
    error_page 502 503 504 /_offline.html;
    location = /_offline.html {
        root /var/www/fenolog;
        internal;
    }
}
