# Запуск сервиса одной командой:
#
#   docker compose up
#   открыть http://localhost:8000
#
# Один сервис намеренно. Ни базы, ни очереди, ни отдельного веб-сервера:
# состояние живёт в файлах, фоновые задачи — в пуле потоков того же процесса,
# статика интерфейса отдаётся тем же FastAPI. Каждый лишний контейнер здесь —
# это ещё один способ не запуститься на чужой машине.

services:
  fenolog:
    build:
      context: .
      dockerfile: Dockerfile
    image: fenolog:1.0
    container_name: fenolog
    ports:
      - "8000:8000"
    environment:
      # Сколько сезонов истории тянуть по умолчанию. Ядру для собственной
      # климатической нормы нужно минимум три года.
      FENOLOG_YEARS: "5"
      # Потолок числа сцен на один анализ — ограничение времени ответа, а не
      # качества: без него плотная история Sentinel-2 по крупному полю тянется
      # минутами, и показ превращается в ожидание.
      FENOLOG_MAX_SCENES: "220"
      # Сколько анализов идёт одновременно. Сбор упирается в сеть, а не в
      # процессор, поэтому потоков больше, чем ядер.
      FENOLOG_TASK_WORKERS: "4"
      # Снятие общей помехи района по соседним полям — главный приём проекта.
      # На районе, где ряды соседей уже в кэше, этап стоит доли секунды; на
      # новом — минуты, и это самая долгая часть разбора. Поставьте "0", если
      # показ идёт по чужой сети и время ограничено.
      FENOLOG_NEIGHBOURS: "1"
      # Потолок времени на сбор соседей. Ста пятидесяти секунд хватает на
      # прогретом районе, но на холодном одно поле качается около двухсот, и
      # поправка не успевает применяться вовсе. Для показа на новом районе
      # поднимите до 300-400 — разбор станет дольше, зато приём отработает.
      FENOLOG_SIBLINGS_BUDGET: "150"
      # Прокси для маски пашни ESA WorldCereal. Нужен не везде: Terrascope
      # отвечает не из всех сетей, и там, где соединение не устанавливается,
      # проверка координат теряет один из четырёх каналов — сервис при этом
      # работает и честно пишет об этом в панели источников.
      # Формат: http://логин:пароль@адрес:порт
      FENOLOG_CROPLAND_PROXY: "${FENOLOG_CROPLAND_PROXY:-}"
    volumes:
      # Кэш ответов внешних источников и сохранённые участки переживают
      # пересоздание контейнера. Именно поэтому том именованный, а не anonymous:
      # `docker compose down` его сохранит, `down -v` — снесёт, и это ровно тот
      # способ проверить запуск с чистого листа, которого требует постановка.
      - fenolog-state:/app/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

volumes:
  fenolog-state:
